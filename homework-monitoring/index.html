<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  /* Keep this playground light, including popovers rendered outside .stApp. */
  :root {
    --lab-bg: #f6f8f6;
    --lab-card: #ffffff;
    --lab-fg: #192d23;
    --lab-muted: #56665d;
    --lab-border: #d3ddd5;
    --lab-card-border: #e6ece7;
    --lab-accent: #38651b;
    --lab-action: #c4ed83;
    --lab-soft: #edf4e6;
  }
  .stApp {
    --background-color: var(--lab-bg);
    --secondary-background-color: var(--lab-card);
    --text-color: var(--lab-fg);
    --primary-color: var(--lab-accent);
    color-scheme: light;
    background: var(--lab-bg);
    color: var(--lab-fg);
    font-family: Inter, system-ui, sans-serif;
  }
  .stApp [data-testid="stAppViewContainer"],
  .stApp [data-testid="stMain"],
  .stApp [data-testid="stHeader"],
  .stApp [data-testid="stBottom"],
  .stApp [data-testid="stBottomBlockContainer"] { background: var(--lab-bg); }
  .stApp [data-testid="stHeader"] { color: var(--lab-fg); }
  .stApp .stMainBlockContainer { max-width: 1240px; padding-top: 4.5rem; padding-bottom: 2rem; }
  .stApp h1, .stApp h2, .stApp h3,
  .stApp p, .stApp label, .stApp button { font-family: Inter, system-ui, sans-serif; }
  .stApp h2, .stApp h3 { color: var(--lab-fg); letter-spacing: -.025em; }
  .stApp [data-testid="stMarkdownContainer"],
  .stApp [data-testid="stText"],
  .stApp [data-testid="stMetric"],
  .stApp [data-testid="stExpander"] summary { color: var(--lab-fg); }
  .stApp h3 { font-size: 1.12rem; font-weight: 600; }
  .stApp [data-testid="stCaptionContainer"],
  .stApp [data-testid="stCaptionContainer"] p,
  .stApp [data-testid="stCaptionContainer"] [data-testid="stMarkdownContainer"],
  .stApp [data-testid="stWidgetLabel"],
  .stApp [data-testid="stWidgetLabel"] p,
  .stApp [data-testid="stWidgetLabel"] [data-testid="stMarkdownContainer"] { color: var(--lab-muted); }
  .stApp hr { border-color: var(--lab-border); }
  .playground-header {
    border-bottom: 1px solid var(--lab-border);
    padding: .25rem 0 1.75rem;
    margin-bottom: .5rem;
    background: radial-gradient(ellipse at 85% 0%, #c4ed8326, transparent 65%);
  }
  .playground-header .eyebrow {
    display: inline-flex; align-items: center; gap: .5rem;
    border: 1px solid var(--lab-border); border-radius: 999px;
    padding: .3rem .8rem; color: var(--lab-muted); font-size: .75rem;
  }
  .playground-header .status-dot {
    width: .4rem; height: .4rem; border-radius: 50%; background: var(--lab-accent);
  }
  .playground-header h1 {
    color: var(--lab-fg); font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 600; letter-spacing: -.045em; line-height: 1.15;
    margin: 1rem 0 .75rem; padding: 0;
  }
  .playground-header h1 span { color: var(--lab-accent); }
  .playground-header p { color: var(--lab-muted); margin: 0; line-height: 1.7; }
  .demo-notice {
    margin-top: 1.25rem; padding: .85rem 1rem;
    border: 1px solid #cadcb9; border-left: 3px solid var(--lab-accent);
    border-radius: .45rem; background: var(--lab-soft);
    color: var(--lab-fg); font-size: .9rem; line-height: 1.6;
  }
  .demo-notice strong { color: var(--lab-accent); }
  .st-key-mode_card_0, .st-key-mode_card_1 {
    background: var(--lab-card); border: 1px solid var(--lab-card-border); border-radius: .5rem;
  }
  .st-key-mode_card_0 button, .st-key-mode_card_1 button {
    min-height: 3.2rem; font-size: 1rem; font-weight: 600;
  }
  .stApp button[kind="primary"] {
    background: var(--lab-action); color: var(--lab-fg);
    border: 1px solid #a5cf65; border-radius: .45rem;
  }
  .stApp button[kind="primary"]:hover {
    background: #b5df70; border-color: #92bc52; color: var(--lab-fg);
  }
  .stApp button[kind="secondary"] {
    background: var(--lab-card); color: var(--lab-fg);
    border: 1px solid var(--lab-border); border-radius: .45rem;
    transition: border-color .15s, background .15s;
  }
  .stApp button[kind="secondary"]:hover {
    border-color: var(--lab-accent); background: var(--lab-soft); color: var(--lab-accent);
  }
  .stApp button:focus-visible { outline: 2px solid var(--lab-accent); outline-offset: 3px; }
  .stApp button:disabled { opacity: .55; cursor: not-allowed; }
  .stApp button [data-testid="stMarkdownContainer"] { color: inherit; }
  .st-key-question_library {
    background: var(--lab-card); border: 1px solid var(--lab-card-border); border-radius: .5rem;
  }
  .st-key-question_library button { text-align: left; justify-content: flex-start; }
  .st-key-conversation {
    background: var(--lab-card); border: 1px solid var(--lab-card-border); border-radius: .5rem;
  }
  .stApp [data-testid="stChatMessage"] { background: #f0f4f0; color: var(--lab-fg); }
  .stApp [data-testid="stChatMessage"] [data-testid="stMarkdownContainer"] :is(p, li, table) {
    font-size: .875rem; line-height: 1.55;
  }
  .stApp [data-testid="stChatMessage"] h1 { font-size: 1.25rem; }
  .stApp [data-testid="stChatMessage"] h2 { font-size: 1.125rem; }
  .stApp [data-testid="stChatMessage"] h3 { font-size: 1rem; }
  .stApp [data-testid="stChatMessage"] code { font-size: .8125rem; }
  .stApp [data-testid="stChatInput"] { background: var(--lab-card); border-color: var(--lab-border); }
  .stApp [data-testid="stChatInput"]:focus-within { border-color: var(--lab-accent); }
  .stApp [data-testid="stChatInput"] textarea {
    background: var(--lab-card); color: var(--lab-fg); font-size: .875rem;
  }
  .stApp [data-testid="stChatInput"] textarea::placeholder { color: var(--lab-muted); }
  .stApp [data-testid="stChatInputSubmitButton"] { color: var(--lab-accent); }
  .stApp [data-testid="stPopoverButton"] {
    background: var(--lab-card); color: var(--lab-fg); border-color: var(--lab-border);
  }
  .stApp [data-testid="stExpander"] { border-color: var(--lab-border); color: var(--lab-fg); }
  .st-key-conversation [data-testid="stExpander"] details { border-color: var(--lab-card-border); }
  .stApp [data-testid="stTextInputRootElement"],
  .stApp [data-testid="stTextAreaRootElement"],
  .stApp [data-baseweb="select"] > div {
    background: var(--lab-card); color: var(--lab-fg); border-color: var(--lab-border);
  }
  .stApp input, .stApp textarea {
    background: var(--lab-card); color: var(--lab-fg); caret-color: var(--lab-accent);
  }
  .stApp input::placeholder, .stApp textarea::placeholder { color: var(--lab-muted); }
  .stApp [data-baseweb="select"] svg { fill: var(--lab-muted); }
  [data-testid="stPopoverBody"], [data-baseweb="popover"] [role="listbox"],
  [data-baseweb="popover"] [role="option"] {
    color-scheme: light; background: var(--lab-card); color: var(--lab-fg);
    border-color: var(--lab-border);
  }
  [data-testid="stPopoverBody"] [data-testid="stMarkdownContainer"] { color: var(--lab-fg); }
  [data-baseweb="popover"] [role="option"]:hover,
  [data-baseweb="popover"] [role="option"][aria-selected="true"] { background: var(--lab-soft); }
  .chat-welcome { padding: 4.25rem 1.5rem; text-align: center; }
  .welcome-mark {
    display: inline-grid; place-items: center; width: 2.75rem; height: 2.75rem;
    border: 1px solid #cadcb9; border-radius: .6rem; background: var(--lab-soft);
    color: var(--lab-accent); font-size: 1.5rem; margin-bottom: .8rem;
  }
  .chat-welcome h3 { margin: 0 0 .5rem; padding: 0; font-size: 1rem; }
  .chat-welcome p { color: var(--lab-muted); font-size: .875rem; line-height: 1.55; }
  @media (max-width: 760px) {
    .stApp .stMainBlockContainer { padding: 4rem 1rem 2rem; }
    .playground-header { padding-bottom: 1.25rem; }
    .chat-welcome { padding: 3rem 1rem; }
  }
</style>
<header class="playground-header">
  <span class="eyebrow"><span class="status-dot"></span>Credit monitoring · UI prototype</span>
  <h1>Explore evidence.<br><span>Build a credit view.</span></h1>
  <p>A simple agent playground. Start with a question and follow the evidence.</p>
  <aside class="demo-notice" role="note">
    <strong>Monitoring demo · Not the final application.</strong><br>
    This prototype is for testing agent interactions and monitoring features.
  </aside>
</header>
