[project]
name = "ai-credit-monitoring"
version = "0.1.0"
description = "Evidence-backed AI credit monitoring proof of concept with a working analyst workspace."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.0",
    "gitsource>=0.0.5",
    "httpx>=0.28,<1",
    "logfire>=5.2,<6",
    "markitdown>=0.1.0",
    "minsearch>=0.0.5",
    "pandas>=2.2.0",
    "pydantic>=2.12.5,<3",
    "pydantic-ai-slim[openai]>=2.54.0,<3",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "streamlit>=1.41.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn==1.8.0",
    "numpy==2.4.4",
    "scipy==1.17.1",
    "joblib==1.5.3",
]

[dependency-groups]
dev = [
    "nbformat>=5.10.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.0.0,<2",
    "ruff>=0.9.0",
]

notebooks = ["jupyter>=1.0.0"]

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_monitoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
include = [
    "src/**/*.py", "tests/**/*.py", "scripts/**/*.py",
    "homework/agent-tests/**/*.py", "homework/monitoring/**/*.py",
    "homework/notebooks/tests/**/*.py", "homework/evaluation/*/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
